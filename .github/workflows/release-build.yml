name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to label the uploaded artifact'
        required: true
        default: '0.9.0'

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  windows-release-build:
    name: Build Windows desktop installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify release version consistency
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1 -ReleaseVersion '${{ github.event.inputs.release_version }}'

      - name: Install npm dependencies with retry
        shell: pwsh
        run: ./scripts/Install-NpmDependencies.ps1

      - name: Run release quality gate
        run: npm run release:check

      - name: Build Tauri Windows installers
        run: npm run tauri:build

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $output = "checksums.txt"
          if (Test-Path $output) { Remove-Item $output -Force }
          $artifacts = @(Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.zip' })
          if ($artifacts.Count -eq 0) { throw 'No installer artifacts were produced.' }
          $wrongVersion = @($artifacts | Where-Object { $_.Name -notlike "*$($env:RELEASE_VERSION)*" })
          if ($wrongVersion.Count -gt 0) { throw "Installer filename version mismatch: $($wrongVersion.Name -join ', ')" }
          $artifacts | ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)" | Tee-Object -FilePath $output -Append
            }
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: diligent-code-studio-v${{ github.event.inputs.release_version }}-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            checksums.txt
          if-no-files-found: error
