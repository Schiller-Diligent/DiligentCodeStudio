name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to label the uploaded artifact'
        required: true
        default: '0.6.10'

permissions:
  contents: read

jobs:
  windows-release-build:
    name: Build Windows desktop installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Run release quality gate
        run: npm run release:check

      - name: Build Tauri Windows installers
        run: npm run tauri:build

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $output = "checksums.txt"
          if (Test-Path $output) { Remove-Item $output -Force }
          Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.zip' } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)" | Tee-Object -FilePath $output -Append
            }

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: diligent-code-studio-v${{ github.event.inputs.release_version }}-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            checksums.txt
          if-no-files-found: error
