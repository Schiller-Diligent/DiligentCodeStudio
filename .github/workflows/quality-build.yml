name: Quality Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'update/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  APP_VERSION_LABEL: '0.7.0-dev'
  PACKAGE_VERSION: '0.7.0'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  quality-build:
    name: Quality Build - ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows
            os: windows-latest
            artifact_suffix: windows
          - platform_name: Linux
            os: ubuntu-22.04
            artifact_suffix: linux
          - platform_name: macOS
            os: macos-15-intel
            artifact_suffix: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install npm dependencies with retry
        shell: pwsh
        run: ./scripts/Install-NpmDependencies.ps1

      - name: Run TypeScript, smoke, unit, security, build, and npm audit checks
        run: npm run quality

      - name: Rust compile check
        run: npm run check:rust

      - name: Rust unit tests
        run: npm run test:rust

      - name: Generate Tauri icons if generated platform icons are missing
        shell: pwsh
        run: |
          if (Test-Path "app-icon.png") {
            Write-Host "Regenerating Tauri icon set from app-icon.png..."
            npx tauri icon app-icon.png
          } else {
            Write-Host "app-icon.png not found. Skipping icon generation."
          }

      - name: Build Diligent Code Studio desktop package
        run: npm run tauri:build

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bundleRoot = Join-Path "src-tauri" "target"
          $bundleRoot = Join-Path $bundleRoot "release"
          $bundleRoot = Join-Path $bundleRoot "bundle"

          if (-not (Test-Path $bundleRoot)) {
            throw "Bundle output folder not found: $bundleRoot"
          }

          Write-Host "Bundle output:"
          Get-ChildItem $bundleRoot -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize

          $artifactRoot = "dist-artifacts"
          $artifactDir = Join-Path $artifactRoot "${{ matrix.artifact_suffix }}"

          if (Test-Path $artifactDir) {
            Remove-Item $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $bundleFiles = Get-ChildItem $bundleRoot -Recurse -File | Where-Object {
            $_.FullName -notmatch '\.dSYM($|\\|/)'
          }

          if (-not $bundleFiles) {
            throw "No bundle files found under: $bundleRoot"
          }

          foreach ($file in $bundleFiles) {
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path $bundleRoot).Path, $file.FullName)
            $destination = Join-Path $artifactDir $relative
            $destinationFolder = Split-Path $destination -Parent
            New-Item -ItemType Directory -Path $destinationFolder -Force | Out-Null
            Copy-Item $file.FullName $destination -Force
          }

          $checksumFile = Join-Path $artifactDir "checksums-${{ matrix.artifact_suffix }}.txt"
          if (Test-Path $checksumFile) {
            Remove-Item $checksumFile -Force
          }

          $artifactFiles = Get-ChildItem $artifactDir -Recurse -File | Where-Object {
            $_.Name -notlike "checksums-*.txt"
          }

          if (-not $artifactFiles) {
            throw "No staged artifact files found under: $artifactDir"
          }

          foreach ($file in $artifactFiles) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path $artifactDir).Path, $file.FullName)
            "$($hash.Hash)  $relative" | Tee-Object -FilePath $checksumFile -Append
          }

          Write-Host "Staged artifacts:"
          Get-ChildItem $artifactDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "Checksums:"
          Get-Content $checksumFile

      - name: Upload ${{ matrix.platform_name }} build artifact
        uses: actions/upload-artifact@v4
        with:
          name: diligent-code-studio-${{ env.APP_VERSION_LABEL }}-${{ matrix.artifact_suffix }}
          path: dist-artifacts/${{ matrix.artifact_suffix }}/**
          if-no-files-found: error
          retention-days: 14