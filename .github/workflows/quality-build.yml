name: Quality Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'update/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  quality-build:
    name: Quality Build - ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows
            os: windows-latest
            artifact_suffix: windows
          - platform_name: Linux
            os: ubuntu-latest
            artifact_suffix: linux
          - platform_name: macOS
            os: macos-latest
            artifact_suffix: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Run quality checks
        shell: pwsh
        run: |
          npm run quality

      - name: Build Tauri packages
        shell: pwsh
        run: |
          npm run tauri:build --if-present

      - name: Stage build artifacts
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          function Join-Many {
            param([string[]]$Parts)

            $current = $Parts[0]
            for ($i = 1; $i -lt $Parts.Count; $i++) {
              $current = Join-Path $current $Parts[$i]
            }
            return $current
          }

          function Copy-IfExists {
            param(
              [string]$Source,
              [string]$Destination,
              [switch]$Recurse
            )

            if (Test-Path $Source) {
              New-Item -ItemType Directory -Path (Split-Path $Destination -Parent) -Force | Out-Null
              if ($Recurse) {
                Copy-Item $Source $Destination -Recurse -Force
              } else {
                Copy-Item $Source $Destination -Force
              }
              return $true
            }

            return $false
          }

          $workspace = $env:GITHUB_WORKSPACE
          if (-not $workspace) {
            $workspace = (Get-Location).Path
          }

          $suffix = "${{ matrix.artifact_suffix }}"
          $sha = "${{ github.sha }}"
          $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0, 7) } else { $sha }

          $artifactRoot = Join-Path $workspace "dist-artifacts"
          $stage = Join-Path $artifactRoot $suffix

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $summary = Join-Path $stage "BUILD-SUMMARY-$suffix.txt"
          "Diligent Code Studio Quality Build Artifact" | Set-Content $summary
          "Platform: ${{ matrix.platform_name }}" | Add-Content $summary
          "Runner OS: ${{ runner.os }}" | Add-Content $summary
          "Commit: ${{ github.sha }}" | Add-Content $summary
          "Run ID: ${{ github.run_id }}" | Add-Content $summary
          "Run Attempt: ${{ github.run_attempt }}" | Add-Content $summary
          "Ref: ${{ github.ref }}" | Add-Content $summary
          "Generated: $(Get-Date -Format o)" | Add-Content $summary
          "Workspace: $workspace" | Add-Content $summary
          "" | Add-Content $summary

          try {
            if (Copy-IfExists "package.json" (Join-Path $stage "package.json")) {
              "Included package.json." | Add-Content $summary
            }

            if (Copy-IfExists "package-lock.json" (Join-Path $stage "package-lock.json")) {
              "Included package-lock.json." | Add-Content $summary
            }

            if (Copy-IfExists "README.md" (Join-Path $stage "README.md")) {
              "Included README.md." | Add-Content $summary
            }

            if (Copy-IfExists "dist" (Join-Path $stage "dist") -Recurse) {
              "Included frontend dist folder." | Add-Content $summary
            } else {
              "Frontend dist folder was not found." | Add-Content $summary
            }

            $publicManuals = Join-Many @("public", "manuals")
            if (Copy-IfExists $publicManuals (Join-Path $stage "public-manuals") -Recurse) {
              "Included public/manuals." | Add-Content $summary
            }

            if (Copy-IfExists "docs" (Join-Path $stage "docs") -Recurse) {
              "Included docs folder." | Add-Content $summary
            }

            $bundleRoot = Join-Many @("src-tauri", "target", "release", "bundle")
            if (Copy-IfExists $bundleRoot (Join-Path $stage "tauri-bundle") -Recurse) {
              "Included Tauri bundle output." | Add-Content $summary
            } else {
              "Tauri bundle output was not found at $bundleRoot." | Add-Content $summary
            }

            $windowsExe = Join-Many @("src-tauri", "target", "release", "diligent-code-studio.exe")
            if (Copy-IfExists $windowsExe (Join-Many @($stage, "release-binary", "diligent-code-studio.exe"))) {
              "Included Windows release binary." | Add-Content $summary
            }

            $unixBinary = Join-Many @("src-tauri", "target", "release", "diligent-code-studio")
            if (Copy-IfExists $unixBinary (Join-Many @($stage, "release-binary", "diligent-code-studio"))) {
              "Included Unix release binary." | Add-Content $summary
            }

            $files = Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue
            "Staged file count before ZIP: $($files.Count)" | Add-Content $summary

            foreach ($file in $files) {
              $relative = [System.IO.Path]::GetRelativePath($stage, $file.FullName)
              " - $relative ($($file.Length) bytes)" | Add-Content $summary
            }

            $zipName = "diligent-code-studio-quality-build-$suffix-$shortSha.zip"
            $zipPath = Join-Path $artifactRoot $zipName

            if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
            }

            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -Force
            "Created ZIP: $zipName" | Add-Content $summary
          } catch {
            "Artifact staging caught error: $($_.Exception.Message)" | Add-Content $summary
            Write-Host "Artifact staging caught error: $($_.Exception.Message)"
          } finally {
            $checksumFile = Join-Path $artifactRoot "SHA256SUMS-$suffix.txt"
            if (Test-Path $checksumFile) {
              Remove-Item $checksumFile -Force
            }

            $rootFiles = Get-ChildItem $artifactRoot -File -ErrorAction SilentlyContinue | Sort-Object Name
            if ($rootFiles) {
              foreach ($file in $rootFiles) {
                $hash = Get-FileHash $file.FullName -Algorithm SHA256
                "$($hash.Hash.ToLower())  $($file.Name)" | Add-Content $checksumFile
              }
            } else {
              "No root artifact files existed when checksum file was created." | Set-Content $checksumFile
            }

            $finalFiles = Get-ChildItem $artifactRoot -Recurse -File -ErrorAction SilentlyContinue
            "Final artifact file count: $($finalFiles.Count)" | Add-Content $summary

            Write-Host "Artifact root:"
            Get-ChildItem $artifactRoot -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            Write-Host ""
            Write-Host "Checksums:"
            Get-Content $checksumFile
          }

      - name: Upload ${{ matrix.platform_name }} build artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diligent-code-studio-${{ matrix.artifact_suffix }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-artifacts/**
          if-no-files-found: error
          retention-days: 30