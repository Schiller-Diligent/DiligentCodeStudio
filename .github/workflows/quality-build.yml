name: Quality Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'update/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  quality-build:
    name: Typecheck, tests, frontend build, and audits
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies with retry
        shell: pwsh
        run: ./scripts/Install-NpmDependencies.ps1

      - name: Run TypeScript, smoke, unit, security, build, and npm audit checks
        run: npm run quality

      - name: Rust compile check
        run: npm run check:rust

      - name: Rust unit tests
        run: npm run test:rust
