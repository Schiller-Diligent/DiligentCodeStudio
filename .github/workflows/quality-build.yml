name: Quality Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'update/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  quality-build:
    name: Quality Build - ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows
            os: windows-latest
            artifact_suffix: windows
          - platform_name: Linux
            os: ubuntu-latest
            artifact_suffix: linux
          - platform_name: macOS
            os: macos-latest
            artifact_suffix: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Run quality checks
        shell: pwsh
        run: |
          npm run quality

      - name: Build Tauri packages
        shell: pwsh
        run: |
          npm run tauri:build --if-present

      - name: Stage build artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $suffix = "${{ matrix.artifact_suffix }}"
          $sha = "${{ github.sha }}"
          $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0, 7) } else { $sha }

          $artifactRoot = Join-Path $PWD ".dcs-artifacts"
          $stage = Join-Path $artifactRoot $suffix
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $summary = Join-Path $stage "BUILD-SUMMARY-$suffix.txt"
          "Diligent Code Studio Quality Build Artifact" | Set-Content $summary
          "Platform: ${{ matrix.platform_name }}" | Add-Content $summary
          "Runner OS: ${{ runner.os }}" | Add-Content $summary
          "Commit: ${{ github.sha }}" | Add-Content $summary
          "Run ID: ${{ github.run_id }}" | Add-Content $summary
          "Run Attempt: ${{ github.run_attempt }}" | Add-Content $summary
          "Ref: ${{ github.ref }}" | Add-Content $summary
          "Generated: $(Get-Date -Format o)" | Add-Content $summary
          "" | Add-Content $summary

          if (Test-Path "package.json") {
            Copy-Item "package.json" (Join-Path $stage "package.json") -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" (Join-Path $stage "README.md") -Force
          }

          if (Test-Path "dist") {
            $distTarget = Join-Path $stage "dist"
            Copy-Item "dist" $distTarget -Recurse -Force
            "Included frontend dist folder." | Add-Content $summary
          } else {
            "Frontend dist folder was not found." | Add-Content $summary
          }

          if (Test-Path "public\manuals") {
            $manualTarget = Join-Path $stage "public-manuals"
            Copy-Item "public\manuals" $manualTarget -Recurse -Force
            "Included public/manuals." | Add-Content $summary
          }

          if (Test-Path "docs") {
            $docsTarget = Join-Path $stage "docs"
            New-Item -ItemType Directory -Path $docsTarget -Force | Out-Null
            Get-ChildItem "docs" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
              ForEach-Object {
                $relative = [System.IO.Path]::GetRelativePath((Resolve-Path "docs").Path, $_.FullName)
                $target = Join-Path $docsTarget $relative
                New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
                Copy-Item $_.FullName $target -Force
              }
            "Included docs folder." | Add-Content $summary
          }

          $bundleRoot = "src-tauri\target\release\bundle"
          if (Test-Path $bundleRoot) {
            $bundleTarget = Join-Path $stage "tauri-bundle"
            Copy-Item $bundleRoot $bundleTarget -Recurse -Force
            "Included Tauri bundle output." | Add-Content $summary
          } else {
            "Tauri bundle output was not found at $bundleRoot." | Add-Content $summary
          }

          $releaseExe = "src-tauri\target\release\diligent-code-studio.exe"
          if (Test-Path $releaseExe) {
            $binaryTarget = Join-Path $stage "release-binary"
            New-Item -ItemType Directory -Path $binaryTarget -Force | Out-Null
            Copy-Item $releaseExe $binaryTarget -Force
            "Included Windows release binary." | Add-Content $summary
          }

          $releaseBinary = "src-tauri\target\release\diligent-code-studio"
          if (Test-Path $releaseBinary) {
            $binaryTarget = Join-Path $stage "release-binary"
            New-Item -ItemType Directory -Path $binaryTarget -Force | Out-Null
            Copy-Item $releaseBinary $binaryTarget -Force
            "Included Unix release binary." | Add-Content $summary
          }

          $files = Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue
          "Staged file count: $($files.Count)" | Add-Content $summary
          $files | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($stage, $_.FullName)
            " - $relative ($($_.Length) bytes)" | Add-Content $summary
          }

          if ($files.Count -eq 0) {
            throw "No artifact files were staged."
          }

          $zipName = "diligent-code-studio-quality-build-$suffix-$shortSha.zip"
          $zipPath = Join-Path $artifactRoot $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -Force

          $checksumFile = Join-Path $artifactRoot "SHA256SUMS-$suffix.txt"
          if (Test-Path $checksumFile) {
            Remove-Item $checksumFile -Force
          }

          Get-ChildItem $artifactRoot -File -Filter "*.zip" | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content $checksumFile
          }

          Write-Host "Artifact root:"
          Get-ChildItem $artifactRoot -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host ""
          Write-Host "Checksums:"
          Get-Content $checksumFile

      - name: Upload ${{ matrix.platform_name }} build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diligent-code-studio-${{ matrix.artifact_suffix }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .dcs-artifacts/**/*.zip
            .dcs-artifacts/**/*.txt
          if-no-files-found: error
          retention-days: 30