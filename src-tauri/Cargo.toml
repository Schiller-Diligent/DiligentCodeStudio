[package]
name = "diligent-code-studio"
version = "0.9.0"
description = "Diligent Code Studio Community Edition"
authors = ["Diligent Software Services"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"

reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
